name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch:

jobs:
  build-test-benchmark:
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Scalar'
            dir: 'ports/riscv'
            artifact: 'audiomark-results-scalar'
          - name: 'Vector'
            dir: 'ports/riscv/v'
            artifact: 'audiomark-results-vector'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install GCC 15
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15
          echo "CC=gcc-15" >> $GITHUB_ENV
          echo "CXX=g++-15" >> $GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DPORT_DIR=${{ matrix.dir }} \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_CXX_COMPILER=${CXX} \
            -DCMAKE_C_FLAGS="-O3 -march=rv64gc_xtheadvector" \
            -DCMAKE_CXX_FLAGS="-O3 -march=rv64gc_xtheadvector"

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: |
          ./build/test_abf_f32
          ./build/test_aec_f32
          ./build/test_anr_f32
          ./build/test_kws
          ./build/test_mfcc_f32

      - name: Print CPU info
        run: |
          cat /proc/cpuinfo
          echo "CC=${CC:-cc}"
          ${CC:-cc} -v

      - name: Run AudioMark benchmark
        timeout-minutes: 10
        run: ./build/audiomark 2>&1 | tee audiomark_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_output.txt ]; then
            cat audiomark_output.txt
            SCORE_LINE=$(grep "^Score" audiomark_output.txt | tr -s ' ' || true)
            if [[ -n "$SCORE_LINE" ]]; then
              echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
              echo "#### $SCORE_LINE" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "Pipeline failed before benchmark could complete."
            echo "### ${{ matrix.name }} - Build, Test, or Benchmark Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: audiomark_output.txt
          retention-days: 10
