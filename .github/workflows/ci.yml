name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch:

jobs:
  build-test-benchmark:
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Scalar'
            dir: 'ports/riscv'
            march: 'rv64gc'
            artifact: 'scalar'
          - name: 'Scalar - Auto vectorized'
            dir: 'ports/riscv'
            march: 'rv64gc_xtheadvector'
            artifact: 'scalar-auto-vectorized'
          - name: 'Vector'
            dir: 'ports/riscv/v'
            march: 'rv64gc_xtheadvector'
            artifact: 'vector'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache XuanTie toolchain
        id: cache-xuantie
        uses: actions/cache@v4
        with:
          path: /opt/xuantie
          key: xuantie-10.4.0-riscv64-v2

      - name: Install XuanTie toolchain
        if: steps.cache-xuantie.outputs.cache-hit != 'true'
        run: |
          wget -q --show-progress https://github.com/sohail103/xuantie-riscv/releases/download/xuantie-10.4.0/xuantie-toolchain.tar.gz
          sudo mkdir -p /opt/xuantie
          sudo tar -xzf xuantie-toolchain.tar.gz -C /opt/xuantie
          rm xuantie-toolchain.tar.gz

      - name: Setup compiler environment
        run: |
          sudo apt-get install -y libc6-dev
          MULTIARCH_INC=$(dpkg-architecture -qDEB_HOST_MULTIARCH 2>/dev/null || echo "riscv64-linux-gnu")
          echo "/opt/xuantie/bin" >> $GITHUB_PATH
          echo "CC=riscv64-unknown-linux-gnu-gcc" >> $GITHUB_ENV
          echo "MULTIARCH_INC=${MULTIARCH_INC}" >> $GITHUB_ENV

      - name: Print CPU and compiler info
        run: |
          cat /proc/cpuinfo
          ${CC} -v
          ${CC} -dumpmachine
          ${CC} --print-search-dirs

      - name: Configure CMake
        run: |
          CRT_DIR=$(dirname $(find /usr/lib -name "crt1.o" 2>/dev/null | head -1))
          cmake -S . -B build \
            -DPORT_DIR=${{ matrix.dir }} \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_C_FLAGS="-O3 -march=${{ matrix.march }} -isystem /usr/include/${MULTIARCH_INC}" \
            -DCMAKE_EXE_LINKER_FLAGS="-L${CRT_DIR} -B${CRT_DIR} -B/usr/bin -fuse-ld=bfd" \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: |
          ./build/test_abf_f32
          ./build/test_aec_f32
          ./build/test_anr_f32
          ./build/test_kws
          ./build/test_mfcc_f32

      - name: Run AudioMark benchmark
        timeout-minutes: 10
        run: ./build/audiomark 2>&1 | tee audiomark_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_output.txt ]; then
            cat audiomark_output.txt
            SCORE_LINE=$(grep "^Score" audiomark_output.txt | tr -s ' ' || true)
            if [[ -n "$SCORE_LINE" ]]; then
              echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
              echo "#### $SCORE_LINE" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "Pipeline failed before benchmark could complete."
            echo "### ${{ matrix.name }} - Build, Test, or Benchmark Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: audiomark_output.txt
          retention-days: 10
