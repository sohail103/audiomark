name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch:
jobs:
  build-test-benchmark:
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Scalar'
            dir: 'ports/riscv'
            march: 'rv64gc'
            artifact: 'scalar'
          - name: 'Scalar - Auto vectorized'
            dir: 'ports/riscv'
            march: 'rv64gc_xtheadvector'
            artifact: 'scalar-auto-vectorized'
          - name: 'Vector'
            dir: 'ports/riscv/v'
            march: 'rv64gc_xtheadvector'
            artifact: 'vector'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install GCC 16
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 binutils-riscv64-linux-gnu
          echo "CC=gcc-16" >> $GITHUB_ENV
          echo "AS=riscv64-linux-gnu-as" >> $GITHUB_ENV
          echo "LD=riscv64-linux-gnu-ld" >> $GITHUB_ENV
      - name: Print CPU info
        run: |
          cat /proc/cpuinfo
          echo "CC=${CC}"
          ${CC} -v
          ${AS} --version
          ${LD} --version
      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DPORT_DIR=${{ matrix.dir }} \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_ASM_COMPILER=${AS} \
            -DCMAKE_LINKER=${LD} \
            -DCMAKE_C_FLAGS="-O3 -march=${{ matrix.march }}" \
            -DCMAKE_VERBOSE_MAKEFILE=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Run unit tests
        run: |
          ./build/test_abf_f32
          ./build/test_aec_f32
          ./build/test_anr_f32
          ./build/test_kws
          ./build/test_mfcc_f32
      - name: Run AudioMark benchmark
        timeout-minutes: 10
        run: ./build/audiomark 2>&1 | tee audiomark_output.txt
      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_output.txt ]; then
            cat audiomark_output.txt
            SCORE_LINE=$(grep "^Score" audiomark_output.txt | tr -s ' ' || true)
            if [[ -n "$SCORE_LINE" ]]; then
              echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
              echo "#### $SCORE_LINE" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "Pipeline failed before benchmark could complete."
            echo "### ${{ matrix.name }} - Build, Test, or Benchmark Failed" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: audiomark_output.txt
          retention-days: 10
