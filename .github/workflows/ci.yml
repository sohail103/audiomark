name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch:

jobs:
  build-test-benchmark:
    runs-on: ubuntu-24.04-riscv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld

      - name: Print CPU and compiler info
        run: |
          cat /proc/cpuinfo
          cc -v 2>&1

      - name: Configure CMake
        run: cmake -S . -B build -DPORT_DIR=ports/riscv -DCMAKE_C_COMPILER=clang

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: |
          ./build/test_abf_f32
          ./build/test_aec_f32
          ./build/test_anr_f32
          ./build/test_kws
          ./build/test_mfcc_f32

      - name: Run AudioMark benchmark
        timeout-minutes: 15
        run: ./build/audiomark 2>&1 | tee audiomark_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_output.txt ]; then
            cat audiomark_output.txt
          else
            echo "Benchmark did not run."
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiomark-results
          path: audiomark_output.txt
          retention-days: 30

  build-test-benchmark-vector:
    runs-on: ubuntu-24.04-riscv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld

      - name: Print CPU and compiler info
        run: |
          cat /proc/cpuinfo
          cc -v 2>&1

      - name: Check for RVV extension and install QEMU if needed
        run: |
          ISA=$(grep "^isa" /proc/cpuinfo | head -n1 | cut -d: -f2 | tr -d '[:space:]')
          EXTENSIONS=${ISA#rv64}
          if [[ "$EXTENSIONS" == *v* ]]; then
            echo 'RUN=' >> $GITHUB_ENV
          else
            echo 'RUN=qemu-riscv64 -cpu rv64,v=true,vext_spec=v1.0,vlen=128' >> $GITHUB_ENV
            sudo apt-get update -qq
            sudo apt-get install -y qemu-user
          fi

      - name: Configure CMake (RVV)
        run: |
          if [ -z "$RUN" ]; then
            cmake -S . -B build-vector -DPORT_DIR=ports/riscv/v -DCMAKE_C_COMPILER=clang
          else
            cmake -S . -B build-vector -DPORT_DIR=ports/riscv/v -DCMAKE_C_COMPILER=clang -DCMAKE_C_FLAGS="-O2 -march=rv64gcv"
          fi

      - name: Build (RVV)
        run: cmake --build build-vector --parallel

      - name: Run unit tests
        run: |
          $RUN ./build-vector/test_abf_f32
          $RUN ./build-vector/test_aec_f32
          $RUN ./build-vector/test_anr_f32
          $RUN ./build-vector/test_kws
          $RUN ./build-vector/test_mfcc_f32

      - name: Run AudioMark benchmark
        timeout-minutes: 15
        run: |
          $RUN ./build-vector/audiomark 2>&1 | tee audiomark_vector_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_vector_output.txt ]; then
            cat audiomark_vector_output.txt
          else
            echo "Benchmark did not run."
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiomark-vector-results
          path: audiomark_vector_output.txt
          retention-days: 30
