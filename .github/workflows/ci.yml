name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch:

jobs:
  build-test-benchmark:
    runs-on: ubuntu-24.04-riscv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-19 lld-19

      - name: Print CPU and compiler info
        run: |
          cat /proc/cpuinfo
          clang-19 -v 2>&1

      - name: Configure CMake
        run: cmake -S . -B build -DPORT_DIR=ports/riscv -DCMAKE_C_COMPILER=clang-19

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: |
          ./build/test_abf_f32
          ./build/test_aec_f32
          ./build/test_anr_f32
          ./build/test_kws
          ./build/test_mfcc_f32

      - name: Run AudioMark benchmark
        timeout-minutes: 15
        run: ./build/audiomark 2>&1 | tee audiomark_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_output.txt ]; then
            cat audiomark_output.txt
          else
            echo "Benchmark did not run."
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiomark-results
          path: audiomark_output.txt
          retention-days: 30

  build-test-benchmark-vector:
    runs-on: ubuntu-24.04-riscv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-19 lld-19

      - name: Print CPU and compiler info
        run: |
          cat /proc/cpuinfo
          cc -v 2>&1

      - name: Check for RVV extension and install QEMU if needed
        run: |
          ISA=$(grep "^isa" /proc/cpuinfo | head -n1 | cut -d: -f2 | tr -d '[:space:]')
          EXTENSIONS=${ISA#rv64}
          if [[ "$EXTENSIONS" == *v* ]]; then
            echo 'RUN=' >> $GITHUB_ENV
          else
            echo 'RUN=qemu-riscv64 -cpu rv64,v=true,vext_spec=v1.0,vlen=128' >> $GITHUB_ENV
            sudo apt-get update -qq
            sudo apt-get install -y qemu-user
          fi

      - name: Configure CMake (RVV)
        run: |
          if [ -z "$RUN" ]; then
            cmake -S . -B build-vector -DPORT_DIR=ports/riscv/v -DCMAKE_C_COMPILER=clang-19
          else
            cmake -S . -B build-vector -DPORT_DIR=ports/riscv/v -DCMAKE_C_COMPILER=clang-19 -DCMAKE_C_FLAGS="-O2 -march=rv64gcv"
          fi

      - name: Build (RVV)
        run: cmake --build build-vector --parallel

      - name: Run unit tests
        run: |
          $RUN ./build-vector/test_abf_f32
          $RUN ./build-vector/test_aec_f32
          $RUN ./build-vector/test_anr_f32
          $RUN ./build-vector/test_kws
          $RUN ./build-vector/test_mfcc_f32

      - name: Run AudioMark benchmark
        timeout-minutes: 15
        run: |
          $RUN ./build-vector/audiomark 2>&1 | tee audiomark_vector_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_vector_output.txt ]; then
            cat audiomark_vector_output.txt
          else
            echo "Benchmark did not run."
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiomark-vector-results
          path: audiomark_vector_output.txt
          retention-days: 30

  build-test-benchmark-zve32x:
    runs-on: ubuntu-latest
    env:
      VERSION_QEMU: "9.2.4"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache QEMU build
        id: cache-qemu
        uses: actions/cache@v5
        with:
          path: ~/qemu-install
          key: qemu-${{ env.VERSION_QEMU }}-riscv64-linux

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          if [ "${{ steps.cache-qemu.outputs.cache-hit }}" != "true" ]; then
            sudo apt-get install -y \
              clang-19 lld-19 \
              gcc-riscv64-linux-gnu \
              libc6-dev-riscv64-cross \
              libglib2.0-dev libpixman-1-dev \
              ninja-build python3-venv
          else
            sudo apt-get install -y \
              clang-19 lld-19 \
              gcc-riscv64-linux-gnu \
              libc6-dev-riscv64-cross
          fi

      - name: Build QEMU user-mode (riscv64) from source
        if: steps.cache-qemu.outputs.cache-hit != 'true'
        run: |
          wget -q https://download.qemu.org/qemu-${{ env.VERSION_QEMU }}.tar.xz
          tar xf qemu-${{ env.VERSION_QEMU }}.tar.xz
          cd qemu-${{ env.VERSION_QEMU }}
          ./configure \
            --prefix=$HOME/qemu-install \
            --target-list=riscv64-linux-user \
            --disable-system \
            --enable-linux-user \
            --disable-docs \
            --disable-werror
          make -j$(nproc)
          make install

      - name: Check for zve32x extension and set run command
        run: |
          ISA=$(grep "^isa" /proc/cpuinfo | head -n1 | cut -d: -f2 | tr -d '[:space:]')
          EXTENSIONS=${ISA#rv64}
          echo "$HOME/qemu-install/bin" >> $GITHUB_PATH
          if [[ "$EXTENSIONS" == *v* ]] || [[ "$EXTENSIONS" == *zve32x* ]]; then
            echo 'RUN=' >> $GITHUB_ENV
          else
            echo "RUN=$HOME/qemu-install/bin/qemu-riscv64 -L /usr/riscv64-linux-gnu -cpu rv64,g=true,c=true,zve32x=true,vlen=128" >> $GITHUB_ENV
          fi

      - name: Print CPU and compiler info
        run: |
          cat /proc/cpuinfo
          clang-19 -v 2>&1

      - name: Configure CMake
        run: |
          SYSROOT=$(riscv64-linux-gnu-gcc -print-sysroot)
          if [ -z "$RUN" ]; then
            cmake -S . -B build-zve32x \
              -DPORT_DIR=ports/riscv/v \
              -DCMAKE_C_COMPILER=clang-19
          else
            cmake -S . -B build-zve32x \
              -DPORT_DIR=ports/riscv/v \
              -DCMAKE_C_COMPILER=clang-19 \
              -DCMAKE_C_FLAGS="--target=riscv64-linux-gnu -march=rv64gc_zve32x -O2 --sysroot=${SYSROOT}" \
              -DCMAKE_EXE_LINKER_FLAGS="--target=riscv64-linux-gnu --sysroot=${SYSROOT} -fuse-ld=/usr/bin/riscv64-linux-gnu-ld"
          fi

      - name: Build
        run: cmake --build build-zve32x --parallel

      - name: Run unit tests
        run: |
          $RUN ./build-zve32x/test_abf_f32
          $RUN ./build-zve32x/test_aec_f32
          $RUN ./build-zve32x/test_anr_f32
          $RUN ./build-zve32x/test_kws
          $RUN ./build-zve32x/test_mfcc_f32

      - name: Run AudioMark benchmark
        timeout-minutes: 15
        run: $RUN ./build-zve32x/audiomark 2>&1 | tee audiomark_zve32x_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_zve32x_output.txt ]; then
            cat audiomark_zve32x_output.txt
          else
            echo "Benchmark did not run."
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiomark-zve32x-results
          path: audiomark_zve32x_output.txt
          retention-days: 30

