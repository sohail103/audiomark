name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch:

jobs:
  build-test-benchmark:
    runs-on: ubuntu-24.04-riscv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Print CPU and compiler info
        run: |
          cat /proc/cpuinfo
          cc -v 2>&1

      - name: Configure CMake
        run: cmake -S . -B build -DPORT_DIR=ports/riscv

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: |
          ./build/test_abf_f32
          ./build/test_aec_f32
          ./build/test_anr_f32
          ./build/test_kws
          ./build/test_mfcc_f32

      - name: Run AudioMark benchmark
        timeout-minutes: 15
        run: ./build/audiomark 2>&1 | tee audiomark_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_output.txt ]; then
            cat audiomark_output.txt
          else
            echo "Benchmark did not run."
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audiomark-results
          path: audiomark_output.txt
          retention-days: 30

  build-vector:
    runs-on: ubuntu-24.04-riscv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Print CPU and compiler info
        run: |
          cat /proc/cpuinfo
          cc -v 2>&1

      - name: Configure CMake (RVV)
        run: >
          cmake -S . -B build-vector
          -DPORT_DIR=ports/riscv/v
          -DCMAKE_C_FLAGS="-O2 -march=rv64gcv"

      - name: Build (RVV)
        run: cmake --build build-vector --parallel
