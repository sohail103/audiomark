name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch:

env:
  TOOLCHAIN_VERSION: "2026.05.06"
  TOOLCHAIN_DIR: "${{ github.workspace }}/riscv-toolchain"
  TOOLCHAIN_URL: "https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2026.05.06/riscv64-glibc-ubuntu-24.04-gcc.tar.xz"

jobs:
  build-test-benchmark:
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Scalar'
            dir: 'ports/riscv'
            artifact: 'audiomark-results-scalar'
          - name: 'Vector'
            dir: 'ports/riscv/v'
            artifact: 'audiomark-results-vector'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache RISC-V toolchain
        id: cache
        uses: actions/cache@v5
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: riscv-toolchain-${{ env.TOOLCHAIN_VERSION }}

      - name: Install RISC-V toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${TOOLCHAIN_DIR}"
          curl -fL "${TOOLCHAIN_URL}" -o toolchain.tar.xz
          tar -xJf toolchain.tar.xz -C "${TOOLCHAIN_DIR}" --strip-components=1

      - name: Configure environment
        run: |
          echo "${TOOLCHAIN_DIR}/bin" >> $GITHUB_PATH
          echo "CC=${TOOLCHAIN_DIR}/bin/riscv64-unknown-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX=${TOOLCHAIN_DIR}/bin/riscv64-unknown-linux-gnu-g++" >> $GITHUB_ENV

      - name: Configure CMake
        run: cmake -S . -B build -DPORT_DIR=${{ matrix.dir }} -DCMAKE_C_COMPILER=${CC} -DCMAKE_CXX_COMPILER=${CXX}

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: |
          ./build/test_abf_f32
          ./build/test_aec_f32
          ./build/test_anr_f32
          ./build/test_kws
          ./build/test_mfcc_f32

      - name: Print CPU info
        run: |
          cat /proc/cpuinfo
          echo "CC=${CC:-cc}"
          ${CC:-cc} -v

      - name: Run AudioMark benchmark
        timeout-minutes: 10
        run: ./build/audiomark 2>&1 | tee audiomark_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_output.txt ]; then
            cat audiomark_output.txt
            SCORE_LINE=$(grep "^Score" audiomark_output.txt | tr -s ' ' || true)
            if [[ -n "$SCORE_LINE" ]]; then
              echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
              echo "#### $SCORE_LINE" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "Pipeline failed before benchmark could complete."
            echo "### ${{ matrix.name }} - Build, Test, or Benchmark Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: audiomark_output.txt
          retention-days: 10
