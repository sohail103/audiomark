name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch:

jobs:
  build-test-benchmark:
    runs-on: ubuntu-24.04-riscv
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Scalar'
            dir: 'ports/riscv'
            march: 'rv64gc'
            artifact: 'scalar'
          - name: 'Scalar - Auto vectorized'
            dir: 'ports/riscv'
            march: 'rv64gc_xtheadvector'
            artifact: 'scalar-auto-vectorized'
          - name: 'Vector'
            dir: 'ports/riscv/v'
            march: 'rv64gc_xtheadvector'
            artifact: 'vector'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache GCC 16.1.0 + Binutils 2.46.0
        id: cache-gcc
        uses: actions/cache@v4
        with:
          path: /opt/gcc-16.1.0
          key: gcc-16.1.0-binutils-2.46.0-riscv64-v1

      - name: Install GCC 16.1.0 + Binutils 2.46.0
        if: steps.cache-gcc.outputs.cache-hit != 'true'
        run: |
          wget -q --show-progress https://github.com/sohail103/gcc-16.1.0-riscv/releases/download/v16.1.0/gcc-16.1.0-riscv64-withbinutils.tar.xz
          sudo tar -xJf gcc-16.1.0-riscv64-withbinutils.tar.xz -C /
          rm gcc-16.1.0-riscv64-withbinutils.tar.xz

      - name: Setup compiler environment
        run: |
          sudo apt-get install -y libc6-dev
          echo "/opt/gcc-16.1.0/bin" >> $GITHUB_PATH
          echo "CC=gcc" >> $GITHUB_ENV
          echo "AS=as" >> $GITHUB_ENV
          echo "LD=ld" >> $GITHUB_ENV

      - name: Print CPU and compiler info
        run: |
          cat /proc/cpuinfo
          echo "CC=${CC}"
          ${CC} -v
          ${CC} -dumpmachine
          ${CC} --print-search-dirs
          ${AS} --version
          ${LD} --version

      - name: Configure CMake
        run: |
          CRT_DIR=$(dirname $(find /usr -name "crt1.o" 2>/dev/null | head -1))
          echo "CRT_DIR=${CRT_DIR}"
          cmake -S . -B build \
            -DPORT_DIR=${{ matrix.dir }} \
            -DCMAKE_C_COMPILER=${CC} \
            -DCMAKE_LINKER=${LD} \
            -DCMAKE_C_FLAGS="-O3 -march=${{ matrix.march }}" \
            -DCMAKE_EXE_LINKER_FLAGS="-L${CRT_DIR} -B${CRT_DIR}" \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        run: |
          ./build/test_abf_f32
          ./build/test_aec_f32
          ./build/test_anr_f32
          ./build/test_kws
          ./build/test_mfcc_f32

      - name: Run AudioMark benchmark
        timeout-minutes: 10
        run: ./build/audiomark 2>&1 | tee audiomark_output.txt

      - name: Report AudioMark score
        if: always()
        run: |
          if [ -f audiomark_output.txt ]; then
            cat audiomark_output.txt
            SCORE_LINE=$(grep "^Score" audiomark_output.txt | tr -s ' ' || true)
            if [[ -n "$SCORE_LINE" ]]; then
              echo "### ${{ matrix.name }}" >> $GITHUB_STEP_SUMMARY
              echo "#### $SCORE_LINE" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "Pipeline failed before benchmark could complete."
            echo "### ${{ matrix.name }} - Build, Test, or Benchmark Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: audiomark_output.txt
          retention-days: 10
